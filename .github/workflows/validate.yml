name: Validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Format check
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        cloud: [aws, azure, gcp]

    defaults:
      run:
        working-directory: root/${{ matrix.cloud }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate