#cloud-config
# No "- default": only the user below is created.
# WARNING: check the hash before applying, there is no backup user.

packages:
  - fail2ban
  # - ec2-instance-connect

users:
  - name: ${username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash

write_files:
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = 1h
      findtime = 10m
      maxretry = 5
      bantime.increment = true

      [sshd]
      enabled = true
      backend = systemd

runcmd:
  - systemctl enable --now fail2ban
%{ if extra != "" ~}
  # Extra user_data from caller
  - |
    ${indent(4, extra)}
%{ endif ~}
